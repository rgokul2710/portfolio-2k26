<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PortFolio 2K26 | Records</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 10px;
      -webkit-text-size-adjust: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    /* Navigation */
    .nav-bar {
      text-align: center;
      margin: 15px 0;
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    .nav-bar a {
      color: #4285f4;
      text-decoration: none;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 5px;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    .nav-bar a:hover {
      background: #f0f2f5;
    }

    /* Calendar Styles */
    .calendar-container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto 20px auto;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header h3 {
      margin: 0;
      font-size: 1.3rem;
    }

    .nav-button {
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .nav-button:hover {
      background: #3367d6;
      transform: scale(1.05);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 10px;
    }

    .day-header {
      text-align: center;
      font-weight: bold;
      padding: 10px 5px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      min-height: 50px;
      padding: 5px;
    }

    .calendar-day:hover {
      background: #f0f2f5;
      transform: scale(1.02);
    }

    .calendar-day.other-month {
      color: #ccc;
      cursor: default;
    }

    .calendar-day.other-month:hover {
      background: transparent;
      transform: none;
    }

    .calendar-day.today {
      background: #4285f4;
      color: white;
      font-weight: bold;
    }

    .calendar-day.today:hover {
      background: #3367d6;
    }

    .day-number {
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .completion-indicator {
      display: flex;
      gap: 1px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .habit-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf50;
    }

    .habit-dot.missed {
      background: #f44336;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 0;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .close-button {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
      padding: 5px;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-button:hover {
      background: #f0f0f0;
    }

    .modal-body {
      padding: 20px;
    }

    .habit-section {
      margin-bottom: 20px;
    }

    .habit-section h4 {
      margin: 0 0 10px 0;
      font-size: 1rem;
    }

    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #f9f9f9;
      border-radius: 6px;
      border-left: 4px solid;
    }

    .habit-item.completed {
      border-left-color: #4caf50;
    }

    .habit-item.missed {
      border-left-color: #f44336;
    }

    .habit-info {
      flex: 1;
    }

    .habit-name {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .habit-owner {
      font-size: 0.8rem;
      color: #666;
    }

    /* Statistics Cards */
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #4285f4;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #666;
    }

    /* Responsive adjustments */
    @media (min-width: 768px) {
      body {
        padding: 20px;
      }
      .header h1 {
        font-size: 2rem;
      }
      .calendar-container {
        padding: 30px;
      }
    }

    @media (max-width: 600px) {
      .calendar-day {
        min-height: 40px;
        padding: 3px;
      }
      
      .day-number {
        font-size: 0.8rem;
      }
      
      .habit-dot {
        width: 4px;
        height: 4px;
      }
      
      .modal-content {
        width: 95%;
        margin: 10% auto;
      }

      .stats-section {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Records</h1>
    <p>track your progress!</p>
  </div>

  <div class="nav-bar">
    <a href="dashboard.html">Habits</a>
    <a href="streaks.html">Streaks</a>
    <a href="records.html">Records</a>
  </div>

  <!-- Statistics Section -->
  <div class="stats-section" id="statsSection">
    <!-- Stats will be populated by JavaScript -->
  </div>

  <!-- Calendar Section -->
  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prevMonth" class="nav-button">‹</button>
      <h3 id="currentMonth"></h3>
      <button id="nextMonth" class="nav-button">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Date Details Modal -->
  <div id="dateModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalDate"></h3>
        <button id="closeModal" class="close-button">×</button>
      </div>
      <div class="modal-body">
        <div class="habit-section">
          <h4>✅ Completed Habits</h4>
          <div id="completedHabits" class="habit-list"></div>
        </div>
        <div class="habit-section">
          <h4>❌ Missed Habits</h4>
          <div id="missedHabits" class="habit-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAHqv3EkgsA9iyW4EJD6IRCdZg78a9yd78",
      authDomain: "portfolio-2k26.firebaseapp.com",
      projectId: "portfolio-2k26",
      storageBucket: "portfolio-2k26.firebasestorage.app",
      messagingSenderId: "313180251597",
      appId: "1:313180251597:web:e5c9a3c0cb36750927d084"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Friend data
    const friends = [
      { id: "hazsED1W6mbXl4UoTlpVq79Gj2K3", name: "Gokul", color: "#FF6384" },
      { id: "jZ1wad5uaKZj7PlcMoLRjEVLeO13", name: "Hari", color: "#36A2EB" },
      { id: "KoDRu25jL2SMKQWFeHHzhsNhXsN2", name: "Kathir", color: "#FFCE56" }
    ];

    // Calendar variables
    let currentCalendarMonth = new Date();
    let calendarData = {};
    let habits = [];
    let monthlyStats = {};

    // On page load
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        loadHabits().then(() => {
          loadCalendarData().then(() => {
            renderCalendar();
            renderStats();
          });
        });
      }
    });

    async function loadHabits() {
      const snapshot = await db.collection("habits").get();
      habits = snapshot.docs.map(doc => ({
        id: doc.id,
        name: doc.data().name,
        userId: doc.data().userId
      }));
    }

    async function loadCalendarData() {
      const startDate = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), 1);
      const endDate = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 0);
      
      // Extend range to include previous and next month days
      startDate.setDate(startDate.getDate() - 7);
      endDate.setDate(endDate.getDate() + 7);
      
      // Format dates consistently
      const startDateStr = startDate.getFullYear() + '-' + 
        String(startDate.getMonth() + 1).padStart(2, '0') + '-' + 
        String(startDate.getDate()).padStart(2, '0');
      const endDateStr = endDate.getFullYear() + '-' + 
        String(endDate.getMonth() + 1).padStart(2, '0') + '-' + 
        String(endDate.getDate()).padStart(2, '0');
      
      const completions = await db.collection("completions")
        .where("userId", "in", friends.map(f => f.id))
        .where("date", ">=", startDateStr)
        .where("date", "<=", endDateStr)
        .get();
      
      calendarData = {};
      
      completions.forEach(doc => {
        const data = doc.data();
        if (!calendarData[data.date]) {
          calendarData[data.date] = [];
        }
        calendarData[data.date].push({
          habitId: data.habitId,
          userId: data.userId,
          habitName: habits.find(h => h.id === data.habitId)?.name || 'Unknown',
          userName: friends.find(f => f.id === data.userId)?.name || 'Unknown'
        });
      });

      // Calculate monthly stats
      calculateMonthlyStats();
    }

    function calculateMonthlyStats() {
      const monthStart = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), 1);
      const monthEnd = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 0);
      
      let completionDays = new Set();
      const userStats = {};
      
      // Initialize user stats
      friends.forEach(friend => {
        userStats[friend.id] = {
          name: friend.name,
          color: friend.color,
          totalCompletions: 0,
          totalPossible: habits.length * monthEnd.getDate()
        };
      });
      
      // Count completions for the current month
      for (let day = 1; day <= monthEnd.getDate(); day++) {
        const dateStr = currentCalendarMonth.getFullYear() + '-' + 
          String(currentCalendarMonth.getMonth() + 1).padStart(2, '0') + '-' + 
          String(day).padStart(2, '0');
        
        const dayCompletions = calendarData[dateStr] || [];
        
        if (dayCompletions.length > 0) {
          completionDays.add(dateStr);
        }
        
        // Count completions by user
        dayCompletions.forEach(completion => {
          if (userStats[completion.userId]) {
            userStats[completion.userId].totalCompletions++;
          }
        });
      }
      
      // Calculate completion rates
      Object.keys(userStats).forEach(userId => {
        const user = userStats[userId];
        user.completionRate = user.totalPossible > 0 ? 
          Math.round((user.totalCompletions / user.totalPossible) * 100) : 0;
      });
      
      monthlyStats = {
        activeDays: completionDays.size,
        userStats: Object.values(userStats)
      };
    }
    
    function renderStats() {
      const statsSection = document.getElementById('statsSection');
      
      let statsHTML = `
        <div class="stat-card">
          <div class="stat-number">${monthlyStats.activeDays}</div>
          <div class="stat-label">Active Days</div>
        </div>
      `;
      
      // Add user-specific stats
      monthlyStats.userStats.forEach(user => {
        statsHTML += `
          <div class="stat-card">
            <div class="stat-number" style="color: ${user.color}">${user.totalCompletions}</div>
            <div class="stat-label">${user.name} Completions</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" style="color: ${user.color}">${user.completionRate}%</div>
            <div class="stat-label">${user.name} Rate</div>
          </div>
        `;
      });
      
      statsSection.innerHTML = statsHTML;
    }


    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthElement = document.getElementById('currentMonth');
      
      monthElement.textContent = currentCalendarMonth.toLocaleDateString('en-US', { 
        month: 'long', 
        year: 'numeric' 
      });
      
      // Clear grid
      grid.innerHTML = '';
      
      // Add day headers
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.textContent = day;
        grid.appendChild(dayHeader);
      });
      
      // Get first day of month and number of days
      const firstDay = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), 1);
      const lastDay = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 0);
      const today = new Date();
      
      // Add empty cells for days before first day of month
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());
      
      // Generate 42 days (6 weeks)
      for (let i = 0; i < 42; i++) {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + i);
        
        const dayElement = document.createElement('div');
        dayElement.className = 'calendar-day';
        
        const isCurrentMonth = currentDate.getMonth() === currentCalendarMonth.getMonth();
        const isToday = currentDate.toDateString() === today.toDateString();
        
        // Format date consistently (YYYY-MM-DD)
        const dateStr = currentDate.getFullYear() + '-' + 
          String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + 
          String(currentDate.getDate()).padStart(2, '0');
        
        if (!isCurrentMonth) {
          dayElement.classList.add('other-month');
        }
        
        if (isToday) {
          dayElement.classList.add('today');
        }
        
        // Day number
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = currentDate.getDate();
        dayElement.appendChild(dayNumber);
        
        // Completion indicators
        if (isCurrentMonth) {
          const completedHabits = calendarData[dateStr] || [];
          const totalHabits = habits.length * friends.length;
          
          if (completedHabits.length > 0 || totalHabits > 0) {
            const indicator = document.createElement('div');
            indicator.className = 'completion-indicator';
            
            // Add dots for completed habits (max 6 visible)
            const maxDots = Math.min(6, totalHabits);
            for (let j = 0; j < maxDots; j++) {
              const dot = document.createElement('div');
              dot.className = 'habit-dot';
              if (j >= completedHabits.length) {
                dot.classList.add('missed');
              }
              indicator.appendChild(dot);
            }
            
            dayElement.appendChild(indicator);
          }
          
          // Add click handler
          dayElement.addEventListener('click', () => showDateDetails(dateStr, currentDate));
        }
        
        grid.appendChild(dayElement);
      }
    }

    async function showDateDetails(dateStr, date) {
      const modal = document.getElementById('dateModal');
      const modalDate = document.getElementById('modalDate');
      const completedHabits = document.getElementById('completedHabits');
      const missedHabits = document.getElementById('missedHabits');
      
      modalDate.textContent = date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      
      const dayCompletions = calendarData[dateStr] || [];
      
      // Get all possible habit-user combinations
      const allCombinations = [];
      habits.forEach(habit => {
        friends.forEach(friend => {
          allCombinations.push({
            habitId: habit.id,
            habitName: habit.name,
            userId: friend.id,
            userName: friend.name,
            userColor: friend.color
          });
        });
      });
      
      // Separate completed and missed, then group by user
      const completedByUser = {};
      const missedByUser = {};
      
      allCombinations.forEach(combo => {
        const wasCompleted = dayCompletions.some(comp => 
          comp.habitId === combo.habitId && comp.userId === combo.userId
        );
        
        if (wasCompleted) {
          if (!completedByUser[combo.userName]) {
            completedByUser[combo.userName] = {
              userName: combo.userName,
              userColor: combo.userColor,
              habits: []
            };
          }
          completedByUser[combo.userName].habits.push(combo.habitName);
        } else {
          if (!missedByUser[combo.userName]) {
            missedByUser[combo.userName] = {
              userName: combo.userName,
              userColor: combo.userColor,
              habits: []
            };
          }
          missedByUser[combo.userName].habits.push(combo.habitName);
        }
      });
      
      // Render completed habits grouped by user
      const completedUsers = Object.values(completedByUser);
      completedHabits.innerHTML = completedUsers.length > 0 
        ? completedUsers.map(user => `
            <div class="habit-item completed">
              <div class="habit-info">
                <div class="habit-name" style="color: ${user.userColor}">${user.userName}</div>
                <div class="habit-owner">${user.habits.join(', ')}</div>
              </div>
            </div>
          `).join('')
        : '<div style="color: #666; font-style: italic;">No habits completed</div>';
      
      // Render missed habits grouped by user
      const missedUsers = Object.values(missedByUser);
      missedHabits.innerHTML = missedUsers.length > 0 
        ? missedUsers.map(user => `
            <div class="habit-item missed">
              <div class="habit-info">
                <div class="habit-name" style="color: ${user.userColor}">${user.userName}</div>
                <div class="habit-owner">${user.habits.join(', ')}</div>
              </div>
            </div>
          `).join('')
        : '<div style="color: #666; font-style: italic;">All habits completed!</div>';
      
      modal.style.display = 'block';
    }

    // Event listeners
    document.getElementById('prevMonth').addEventListener('click', async () => {
      currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() - 1);
      await loadCalendarData();
      renderCalendar();
      renderStats();
    });

    document.getElementById('nextMonth').addEventListener('click', async () => {
      currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() + 1);
      await loadCalendarData();
      renderCalendar();
      renderStats();
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('dateModal').style.display = 'none';
    });

    // Close modal when clicking outside
    window.addEventListener('click', (event) => {
      const modal = document.getElementById('dateModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
